<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scheduling POC - Filterable Calendar</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

  <!-- 🔹 Filters + Actions -->
  <div class="topbar">
    <div class="filters">
      <label for="workerFilter" class="form-label mb-0">Support Worker</label>
      <select id="workerFilter" class="form-select" style="width:220px;">
        <option value="">— All Workers —</option>
      </select>

      <label for="participantSearch" class="form-label mb-0">Participant / Client</label>
      <input id="participantSearch" type="text" class="form-control" placeholder="Search by participant name" style="width:240px;" />

      <button id="clearFilters" class="btn btn-outline-secondary">Clear Filters</button>
    </div>

    <div class="mass-actions">
      <button id="enableSelectBtn" class="btn btn-outline-primary">Enable Multi-select</button>
      <div id="multiControls" style="display:none; align-items:center;">
        <span class="me-2">Selected: <span id="selectedCount">0</span></span>
        <select id="reassignTo" class="form-select" style="width:200px;">
          <option value="">— Reassign to —</option>
        </select>
        <button id="massReassignBtn" class="btn btn-success">Mass Reassign</button>
        <button id="clearSelectionBtn" class="btn btn-outline-danger">Clear</button>
      </div>
    </div>
  </div>

  <!-- 🔹 Calendar Area -->
  <div id="calendar"></div>
  <div class="legend" id="legend"></div>

  <!-- 🔹 Popup with Creator Form (iframe) -->
  <div class="modal fade" id="creatorFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <iframe height='500px' width='100%' frameborder='0' allowTransparency='true' scrolling='auto' src='https://creatorapp.zohopublic.com/zoho_hello694/calender-includa/form-embed/Booking_Form/ezybrP1fkFte0DPXAVtBsVVrbB9EnJXwk1mm6WOFZ4fgdkHZ8WpZVRpaCBB4xKhSWvMV3GdUrmTp6evWEC0G5966OOZ3OWJSRVWF'></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom JS -->
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="widget.js"></script>
</body>
</html>
