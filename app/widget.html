<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Scheduling POC - Filterable Calendar</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <style>
    /* Additional iframe stabilization */
    #creatorFormFrame {
      border: none;
      width: 100%;
      height: 100%;
      min-height: 700px;
      overflow-y: auto !important;
      overflow-x: hidden;
    }
    
    .modal-body {
      overflow-y: auto !important;
      overflow-x: hidden !important;
      height: 85vh !important;
      max-height: 800px;
      min-height: 700px;
      display: flex !important;
      flex-direction: column;
      padding: 0 !important;
    }
    
    .modal-dialog {
      max-width: 95% !important;
      width: 900px !important;
      margin: 1.75rem auto;
    }
    
    .modal-content {
      max-height: 90vh;
    }
  </style>
</head>
<body>

  <!-- 🔹 Filters + Actions -->
  <div class="topbar">
    <div class="filters">
      <label for="workerFilter" class="form-label mb-0">Support Worker</label>
      <select id="workerFilter" class="form-select" style="width:220px;">
        <option value="">— All Workers —</option>
      </select>

      <label for="participantSearch" class="form-label mb-0">Participant / Client</label>
      <input id="participantSearch" type="text" class="form-control" placeholder="Search by participant name" style="width:240px;" />

      <button id="clearFilters" class="btn btn-outline-secondary">Clear Filters</button>
    </div>

    <div class="mass-actions">
      <button id="enableSelectBtn" class="btn btn-outline-primary">Enable Multi-select</button>
      <div id="multiControls" style="display:none; align-items:center;">
        <span class="me-2">Selected: <span id="selectedCount">0</span></span>
        <select id="reassignTo" class="form-select" style="width:200px;">
          <option value="">— Reassign to —</option>
        </select>
        <button id="massReassignBtn" class="btn btn-success">Mass Reassign</button>
        <button id="clearSelectionBtn" class="btn btn-outline-danger">Clear</button>
      </div>
    </div>
  </div>

  <!-- 🔹 Calendar Area -->
  <div id="calendar"></div>
  <div class="legend" id="legend"></div>

  <!-- 🔹 Popup with Creator Form (iframe) -->
  <div class="modal fade" id="creatorFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Add New Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-0">
          <iframe 
            id="creatorFormFrame"
            src="https://creatorapp.zohopublic.com/zoho_hello694/calender-includa/form-embed/Booking_Form/BHpO2XsT54Ma22NXYmxkyUJbA9FCaMFwsqDtzmsjzRpp8Zr9GtZxXHqZTSwrV5hmK29s3NtbS6qtQ8HhPNkjt9g0Nj5nbsy9Cx6M?embed=true&hide_header=true"
            scrolling="yes"
            allow="fullscreen">
          </iframe>
        </div>

      </div>
    </div>
  </div>

  <!-- Custom JS -->
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="widget.js"></script>
  
  <script>
    // Prevent iframe from trying to resize dynamically (which can cause breaks)
    window.addEventListener("message", function (e) {
      // Only log, don't resize - let CSS handle it
      if (e.data && e.data.height) {
        console.log("Form height message received:", e.data.height);
      }
    });
    
    // Fast reload only after successful form submission
    let needsReload = false;
    
    document.getElementById('creatorFormModal').addEventListener('hidden.bs.modal', function () {
      // Mark for reload after modal closes (if form was submitted)
      if (needsReload) {
        const iframe = document.getElementById('creatorFormFrame');
        iframe.src = iframe.src; // Quick reload
        needsReload = false;
      }
    });
    
    // Detect when form is submitted successfully
    const iframe = document.getElementById('creatorFormFrame');
    iframe.addEventListener('load', function() {
      try {
        const url = iframe.contentWindow.location.href;
        if (url.includes('success') || url.includes('thankyou')) {
          needsReload = true; // Mark that we need to reload next time
        }
      } catch(e) {
        // Cross-origin, can't check URL
      }
    });
  </script>
</body>
</html>
