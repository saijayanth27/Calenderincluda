<!doctype html>
<html lang="en">

<head>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Stable iframe that respects form's natural layout */
    #creatorFormFrame {
      border: none;
      width: 100%;
      min-height: 600px;
      height: auto;
      overflow: visible;
    }

    .modal-body {
      overflow-y: auto !important;
      overflow-x: hidden !important;
      padding: 0 !important;
      max-height: 80vh !important;
      -webkit-overflow-scrolling: touch;
    }

    .modal-dialog {
      max-width: 95% !important;
      width: 800px !important;
      margin: 1.75rem auto;
    }

    .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      flex-shrink: 0;
      border-bottom: 
      1px solid #f1f5f9;
      padding: 1.25rem 1.5rem;
    }
  </style>
</head>

<body>


  <!-- 🔹 Filters + Actions -->
  <div class="topbar">
    <div class="filters">
      <div class="filter-group">
        <label for="participantSearch">Participant</label>
        <div style="position: relative;">
          <input id="participantSearch" type="text" class="form-control" placeholder="Search participant..."
            style="width:280px;" autocomplete="off" />
          <select id="participantFilter" class="form-select searchable-dropdown"
            style="display: none;" size="8">
            <option value="">— All Participants —</option>
          </select>
        </div>
      </div>

      <div class="filter-group">
        <label for="workerSearch">Support Worker</label>
        <div style="position: relative;">
          <input id="workerSearch" type="text" class="form-control" placeholder="Search worker..."
            style="width:260px;" autocomplete="off" />
          <select id="workerFilter" class="form-select searchable-dropdown"
            style="display: none;" size="8">
            <option value="">— All Workers —</option>
          </select>
        </div>
      </div>

      <div class="action-buttons">
        <button id="submitFilters" class="btn btn-primary">Search</button>
        <button id="clearFilters" class="btn btn-outline-secondary">Clear Filters</button>
      </div>
    </div>
  </div>

  <!-- 🔹 Calendar Area -->
  <div id="calendar"></div>
  <div class="legend" id="legend"></div>

  <!-- 🔹 Popup with Creator Form (iframe) -->
  <div class="modal fade" id="creatorFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <iframe id="crmFormFrame" width="100%" height="550" frameborder="0" style="border:none; border-radius:8px;"
            allowTransparency="true" scrolling="no">
          </iframe>
        </div>

      </div>
    </div>
  </div>


  <!-- Custom JS -->
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="https://js.zohostatic.com/crm/v2.0/sdk.min.js"></script>
  <script src="widget.js"></script>

  <script>
    // Removed iframe-specific logic, now handled natively
  </script>
  <div id="loader" class="loader-overlay">
    <div class="loader-spinner"></div>
  </div>
</body>

</html>
