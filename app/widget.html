<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Scheduling POC - Filterable Calendar</title>

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* Stable iframe that respects form's natural layout */
    #creatorFormFrame {
      border: none;
      width: 100%;
      min-height: 600px;
      height: auto;
      overflow: visible;
    }

    .modal-body {
      overflow-y: auto !important;
      overflow-x: hidden !important;
      padding: 0 !important;
      height: 75vh !important;
      max-height: 750px !important;
      -webkit-overflow-scrolling: touch;
    }

    .modal-dialog {
      max-width: 95% !important;
      width: 900px !important;
      margin: 1.75rem auto;
    }

    .modal-content {
      max-height: 88vh;
      overflow: hidden;
    }

    .modal-header {
      flex-shrink: 0;
      border-bottom: 1px solid #dee2e6;
      padding: 1rem 1.5rem;
    }
  </style>
</head>

<body>

  <!-- 🔹 Filters + Actions -->
  <div class="topbar">
    <div class="filters">
      <label for="participantSearch"
        style="font-size: 14px; margin-right: 8px;padding-bottom: 8px; font-weight: 500;">Participant:</label>
      <div style="display: inline-block; position: relative;">
        <input id="participantSearch" type="text" class="form-control" placeholder="Search participant..."
          style="width:280px; font-size: 14px; padding: 8px 10px;" autocomplete="off" />
        <select id="participantFilter" class="form-select searchable-dropdown"
          style="width:280px; height: 280px; display: none;" size="8">
          <option value="">— All Participants —</option>
        </select>
      </div>

      <label for="workerSearch"
        style="font-size: 14px; margin-right: 8px;padding-bottom: 8px; margin-left: 16px; font-weight: 500;">Support
        Worker:</label>
      <div style="display: inline-block; position: relative;">
        <input id="workerSearch" type="text" class="form-control" placeholder="Search worker..."
          style="width:260px; font-size: 14px; padding: 8px 10px;" autocomplete="off" />
        <select id="workerFilter" class="form-select searchable-dropdown"
          style="width:260px; height: 280px; display: none;" size="8">
          <option value="">— All Workers —</option>
        </select>
      </div>

      <button id="submitFilters" class="btn btn-primary"
        style="padding: 8px 18px; font-size: 14px; margin-left: 16px;">Search</button>
      <button id="clearFilters" class="btn btn-outline-secondary" style="padding: 8px 18px; font-size: 14px;">Clear
        Filters</button>
    </div>
  </div>
  </div>
  </div>

  <!-- 🔹 Calendar Area -->
  <div id="calendar"></div>
  <div class="legend" id="legend"></div>

  <!-- 🔹 Popup with Creator Form (iframe) -->
  <div class="modal fade" id="creatorFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add / Edit Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body p-0">
          <iframe id="crmFormFrame" width="100%" height="550" frameborder="0" style="border:none; border-radius:8px;"
            allowTransparency="true" scrolling="no">
          </iframe>
        </div>

      </div>
    </div>
  </div>


  <!-- Custom JS -->
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="https://js.zohostatic.com/crm/v2.0/sdk.min.js"></script>
  <script src="widget.js"></script>

  <script>
    // Prevent iframe from trying to resize dynamically (which can cause breaks)
    window.addEventListener("message", function (e) {
      // Only log, don't resize - let CSS handle it
      if (e.data && e.data.height) {
        console.log("Form height message received:", e.data.height);
      }
    });

    // Fast reload only after successful form submission
    let needsReload = false;

    document.getElementById('creatorFormModal').addEventListener('hidden.bs.modal', function () {
      // Mark for reload after modal closes (if form was submitted)
      if (needsReload) {
        const iframe = document.getElementById('creatorFormFrame');
        iframe.src = iframe.src; // Quick reload
        needsReload = false;
      }
    });

    // Detect when form is submitted successfully
    const iframe = document.getElementById('creatorFormFrame');
    iframe.addEventListener('load', function () {
      try {
        const url = iframe.contentWindow.location.href;
        if (url.includes('success') || url.includes('thankyou')) {
          needsReload = true; // Mark that we need to reload next time
        }
      } catch (e) {
        // Cross-origin, can't check URL
      }
    });
  </script>
</body>

</html>
